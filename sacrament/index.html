<html lang="en">
<head><script>window.SACRAMENT_DATA = {"ward":"Caldwell 12th Ward","date":"2026-10-25","leaders":[{"label":"Presiding","value":"President Wilford/Bishop Yearsley"},{"label":"Chorister","value":"Brother Cicotte"},{"label":"Conducting","value":"Brother Riley"},{"label":"Organist","value":"Sis. Stolpe/Bro. Thayne"}],"announcements":["Tithing Declaration Please visit Tithing Declaration\nhttps://caldwell12thward-create.github.io/Caldwell12thBishop/ to sign up.","Saturday October 31 1:00pm Trunk or Treat","Sunday November 1 6:00 YSA & HS Senior Fireside Everret Building","Saturday November 7,Ward Level Food Drive, Whole Stake\nFlyers out to the local areas in ward boundaries","Saturday November 14,Ward Level Food Drive, Whole Stake Pickup.","Saturday November 14 3:00 Primary Program Practice","Building Cleanup for November","New Hymn Books Back side has a QR Code for the Building/Ward Portal\nfor Ward Bulletin, Additional Announcements and other Links.","Youth Protection Training","Use of Circles and Gospel Living app","Registration for 2027 FSY is now open"],"opening":[{"label":"Opening Hymn","value":"52 The Day Dawn Is Breaking"},{"label":"Invocation","value":""}],"business":{"title":"Members moved in, Baby Blessing, Recently Baptized, Confirmation, Ordination","items":[]},"schedule":[{"label":"Sacrament Hymn","value":"193 I Stand All Amazed"},{"label":"Speaker #1","value":"Erin Stansell"},{"label":"Inter Hymn","value":"21 Come, Listen to a Prophet's Voice"},{"label":"Speaker #2","value":"Trent Thayne"},{"label":"Closing Hymn","value":"85 How Firm a Foundation"},{"label":"Benediction","value":""}]};</script>

<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Sacrament Meeting</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('announcements-theme'); } catch (e) {}
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  })();

  
  (function () {
    var errors = [];
    function show() {
      var app = document.getElementById('app');
      if (!app || !errors.length) return;
      app.innerHTML = '<section><div class="panel"><div class="empty" style="color:inherit">' +
        '<strong>This page hit an error and couldn\'t load the agenda.</strong><br>' + errors.join('<br>') + '</div></div></section>';
    }
    window.addEventListener('error', function (e) {
      errors.push(String(e.message || 'Unknown error').replace(/[<>&]/g, '') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
      show();
    });
    document.addEventListener('DOMContentLoaded', show);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source&#43;Serif&#43;4:opsz,wght@8..60,500;8..60,600&amp;family=Source&#43;Sans&#43;3:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f5;
    --surface: #ffffff;
    --ink: #1f2a33;
    --muted: #5d6870;
    --line: #e1e4e7;
    --accent: #1b5f8a;
    --accent-soft: #e7f0f6;
    --tile: #eef2f5;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121518; --surface: #1b1f23; --ink: #e9ecef; --muted: #a2abb3;
      --line: #2b3137; --accent: #7cbde3; --accent-soft: #1a3140; --tile: #232a30;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121518; --surface: #1b1f23; --ink: #e9ecef; --muted: #a2abb3;
    --line: #2b3137; --accent: #7cbde3; --accent-soft: #1a3140; --tile: #232a30;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

   
  .top {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: calc(22px + env(safe-area-inset-top, 0px)) 0 22px;
  }
  .top .wrap { display: flex; align-items: flex-start; gap: 12px; }
  .top-text { flex: 1; min-width: 0; }
  .ward { margin: 0 0 4px; font-size: 21px; font-weight: 600; color: var(--muted); }
  h1 {
    margin: 0; font-family: var(--serif); font-weight: 600;
    font-size: clamp(28px, 7.5vw, 36px); line-height: 1.12; letter-spacing: -0.01em;
  }
  .date { margin: 6px 0 0; font-size: 17px; color: var(--muted); }
  .theme-btn {
    flex: none; width: 44px; height: 44px; margin-top: 2px;
    display: grid; place-items: center;
    background: var(--tile); color: var(--ink);
    border: 1px solid var(--line); border-radius: 50%;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .theme-btn svg { width: 22px; height: 22px; }
  .theme-btn .sun { display: none; }
  .is-dark .theme-btn .sun { display: block; }
  .is-dark .theme-btn .moon { display: none; }

  main { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  section { margin-top: 30px; }
  h2 { margin: 0 0 10px; font-family: var(--serif); font-weight: 600; font-size: 23px; }
  .sub { margin: -6px 0 10px; font-size: 15px; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

   
  .roles { display: grid; grid-template-columns: 1fr 1fr; }
  .role { padding: 14px 16px; }
  .role:nth-child(n + 3) { border-top: 1px solid var(--line); }
  .role:nth-child(even) { border-left: 1px solid var(--line); }
  .role .k { font-size: 14px; font-weight: 600; color: var(--muted); }
  .role .v { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
  @media (max-width: 340px) {
    .roles { grid-template-columns: 1fr; }
    .role:nth-child(even) { border-left: 0; }
    .role:nth-child(n + 2) { border-top: 1px solid var(--line); }
  }

   
  .line-item { padding: 14px 16px; border-top: 1px solid var(--line); white-space: pre-line; overflow-wrap: anywhere; }
  .line-item:first-child { border-top: 0; }

   
  .divider { display: flex; align-items: center; gap: 14px; margin-top: 34px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .divider span { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--muted); }

   
  .step { position: relative; display: flex; gap: 14px; align-items: center; padding: 12px 16px; }
  .rail { position: relative; flex: none; width: 58px; align-self: stretch; display: grid; place-items: center; }
  .rail::before {
    content: ""; position: absolute; left: 50%; top: -12px; bottom: -12px;
    width: 2px; margin-left: -1px; background: var(--line);
  }
  .step:first-child .rail::before { top: 50%; }
  .step:last-child .rail::before { bottom: 50%; }
  .step:only-child .rail::before { display: none; }
  .dot {
    position: relative; width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .hymn {
    position: relative; width: 58px; padding: 5px 0 6px; text-align: center;
    background: var(--tile); border-radius: 8px;
  }
  .hymn .t { display: block; font-size: 12px; font-weight: 600; color: var(--accent); }
  .hymn .n { display: block; font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.1; }
  .step-body { flex: 1; min-width: 0; }
  .step .k { font-size: 14px; font-weight: 600; color: var(--muted); }
  .step .v { font-size: 18px; overflow-wrap: anywhere; white-space: pre-line; }
  .step.is-hymn .v { font-family: var(--serif); }
  .step.note .v { font-size: 16px; font-style: italic; color: var(--muted); }

  a.step { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a.step .v { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a.step:active { background: var(--accent-soft); }
  @media (hover: hover) { a.step:hover { background: var(--accent-soft); } }
  .go { flex: none; width: 20px; height: 20px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .empty, .error { padding: 18px 16px; color: var(--muted); }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="top-text">
        <p class="ward" id="ward">Ward</p>
        <h1 id="meetingType">Sacrament Meeting</h1>
        <p class="date" id="date"></p>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="app"></main>

<script>
  const esc = s => String(s == null ? '' : s).replace(/[&<>\u0022\u0027]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const URL_RE = /(https?:\/\/[^\s]+)/g;
  const PHONE_RE = /\(\d{3}\)\s?\d{3}[\s.-]\d{4}\b|\b\d{3}[.-]\d{3}[.-]\d{4}\b/g;
  const stripTrail = u => u.replace(/[.,;:!?)\]]+$/, '');
  const shortUrl = u => {
    const s = u.replace(/^https?:\/{2}/, '').replace(/\/$/, '');
    return s.length > 38 ? s.slice(0, 36) + '…' : s;
  };
  function linkify(text) {
    return String(text).split(URL_RE).map((part, i) => {
      if (i % 2) {
        const url = stripTrail(part);
        return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(shortUrl(url))}</a>${esc(part.slice(url.length))}`;
      }
      return esc(part).replace(PHONE_RE, p => `<a href="tel:${p.replace(/\D/g, '')}">${p}</a>`);
    }).join('');
  }

  // ── Hymn links on churchofjesuschrist.org ──────────────────────────────
  // 1000 and up: Hymns—For Home and Church. Under 1000: the 1985 hymnbook.
  // The page name is the title in lowercase with punctuation dropped and
  // words joined by hyphens ("Abide with Me; 'Tis Eventide" →
  // "abide-with-me-tis-eventide"). If a title in the agenda is spelled
  // differently from the Church's, add the number here with the right
  
  const HYMN_PAGE_OVERRIDES = {
    
  };

  
  
  const CHURCH_SITE = 'https:\/\/www.churchofjesuschrist.org/';

  function hymnSlug(title) {
    return String(title)
      .toLowerCase()
      
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u0027\u2018\u2019\u0060]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function hymnUrl(num, title) {
    const slug = HYMN_PAGE_OVERRIDES[num] || hymnSlug(title);
    if (!slug) return '';
    const book = +num >= 1000 ? 'study/music/hymns-for-home-and-church/' : 'study/manual/hymns/';
    return CHURCH_SITE + book + slug + '?lang=eng';
  }

  const ARROW = '<svg class="go" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  
  const cleanLabel = l => String(l || '').replace(/\s*#\s*\d+\s*$/, '');

  function step(item) {
    const label = cleanLabel(item.label);
    const value = String(item.value || '').trim();
    if (!value) return '';

    if (!label) {
      return `<div class="step note"><div class="rail"><span class="dot"></span></div>
        <div class="step-body"><div class="v">${esc(value)}</div></div></div>`;
    }

    const hymn = /hymn/i.test(label) && value.match(/^(\d{1,4})\b[\s.:–-]*(.*)$/);
    if (hymn) {
      const num = hymn[1], title = (hymn[2] || '').trim();
      const url = hymnUrl(num, title);
      const inner = `<div class="rail"><span class="hymn" aria-hidden="true"><span class="t">Hymn</span><span class="n">${esc(num)}</span></span></div>
        <div class="step-body"><div class="k">${esc(label)}</div>
        <div class="v"><span class="sr">Hymn ${esc(num)}: </span>${esc(title)}</div></div>`;
      return url
        ? `<a class="step is-hymn is-link" href="${esc(url)}" target="_blank" rel="noopener">${inner}${ARROW}</a>`
        : `<div class="step is-hymn">${inner}</div>`;
    }

    return `<div class="step"><div class="rail"><span class="dot"></span></div>
      <div class="step-body"><div class="k">${esc(label)}</div><div class="v">${linkify(value)}</div></div></div>`;
  }

  function program(items) {
    const rows = (items || []).map(step).filter(Boolean).join('');
    return rows ? `<div class="panel">${rows}</div>` : '';
  }

  function render(data) {
    document.getElementById('ward').textContent = data.ward || 'Ward';
    const m = String(data.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) {
      document.getElementById('date').textContent = new Date(+m[1], m[2] - 1, +m[3])
        .toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    let html = '';

    const roles = (data.leaders || []).filter(r => r.label && String(r.value || '').trim());
    if (roles.length) {
      html += `<section aria-label="Leadership"><div class="panel roles">${roles.map(r =>
        `<div class="role"><div class="k">${esc(r.label)}</div><div class="v">${esc(r.value).replace(/\s*\/\s*/g, ' /<wbr>')}</div></div>`).join('')}</div></section>`;
    }

    const ann = (data.announcements || []).filter(s => String(s).trim());
    if (ann.length) {
      html += `<section aria-labelledby="h-ann"><h2 id="h-ann">Announcements</h2>
        <div class="panel">${ann.map(a => `<div class="line-item">${linkify(a)}</div>`).join('')}</div></section>`;
    }

    // One timeline in meeting order: opening hymn and invocation,
    // ward business, then the sacrament hymn through the benediction.
    const bizItems = ((data.business || {}).items || []).filter(s => String(s).trim());
    // No speakers assigned → Fast and Testimony meeting: retitle the page
    // and put testimonies right after the sacrament hymn.
    let schedule = (data.schedule || []).slice();
    const isFast = !schedule.some(r => /speaker/i.test(r.label || '') && String(r.value || '').trim());
    document.getElementById('meetingType').textContent = isFast ? 'Fast and Testimony Meeting' : 'Sacrament Meeting';
    document.title = isFast ? 'Fast and Testimony Meeting' : 'Sacrament Meeting';
    if (isFast) {
      const testimonies = { label: 'Testimonies', value: 'Bearing of testimonies' };
      const after = schedule.findIndex(r => /sacrament\s*hymn/i.test(r.label || ''));
      const before = schedule.findIndex(r => /closing\s*hymn/i.test(r.label || ''));
      if (after >= 0) schedule.splice(after + 1, 0, testimonies);
      else if (before >= 0) schedule.splice(before, 0, testimonies);
      else schedule.push(testimonies);
    }

    const steps = [].concat(
      data.opening || [],
      bizItems.length ? [{ label: 'Ward Business', value: bizItems.join('\n') }] : [],
      schedule
    );
    const sched = program(steps);
    if (sched) {
      html += `<div class="divider" role="separator"><span></span></div>
        <section aria-labelledby="h-sch"><h2 id="h-sch">Sacrament Schedule</h2>${sched}</section>`;
    }

    document.getElementById('app').innerHTML = html ||
      '<section><div class="panel"><div class="empty">This week\'s agenda hasn\'t been posted yet.</div></div></section>';
  }

  
  (function () {
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const isDark = () => { const t = root.getAttribute('data-theme'); return t ? t === 'dark' : media.matches; };
    const sync = () => {
      root.classList.toggle('is-dark', isDark());
      btn.setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme');
    };
    btn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('announcements-theme', next); } catch (e) {}
      sync();
    });
    if (media.addEventListener) media.addEventListener('change', sync);
    sync();
  })();

  
  function sampleData() {
    const t = new Date(); t.setDate(t.getDate() + (7 - t.getDay()) % 7);
    const iso = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    return {
      ward: 'Sample Ward', date: iso,
      leaders: [
        { label: 'Presiding', value: 'Bishop Allen' }, { label: 'Chorister', value: 'Sister Moore' },
        { label: 'Conducting', value: 'Brother Reed' }, { label: 'Organist', value: 'Sister Hale' }
      ],
      announcements: [
        'Ward Halloween party Saturday at 6:00 PM in the cultural hall',
        'Tithing Declaration Please sign up at\nhttps:\/\/example.org/tithing'
      ],
      opening: [{ label: 'Opening Hymn', value: '2 The Spirit of God' }, { label: 'Invocation', value: 'Sister Long' }],
      business: { title: 'Members moved in, Baby Blessing, Recently Baptized, Confirmation, Ordination', items: ['Welcome to the Parker family'] },
      schedule: [
        { label: 'Sacrament Hymn', value: '1007 As Bread Is Broken' },
        { label: 'Speaker #1', value: 'Brother Young' },
        { label: '', value: 'Musical number by the Primary children' },
        { label: 'Inter Hymn', value: '' },
        { label: 'Speaker #2', value: 'Sister Grant' },
        { label: 'Closing Hymn', value: '85 How Firm a Foundation' },
        { label: 'Benediction', value: 'Brother Lee' }
      ]
    };
  }

  if (window.SACRAMENT_DATA) render(window.SACRAMENT_DATA);
  else render(sampleData());
</script>
</body>
</html>
